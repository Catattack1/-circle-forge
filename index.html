<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell Circle Forge — for D&amp;D</title>
<style>
:root{--ink:#05070a;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.075);
 --rule:rgba(255,255,255,.10);--txt:#e7ecf3;--dim:#8b97a8;--warn:#ffb454;--fg:#4fc3ff;--hi:#bfe9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--txt)}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;align-items:baseline;gap:16px;padding:14px 28px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.bar h1{font:400 13px/1 system-ui;letter-spacing:.18em;color:var(--dim);margin:0}
.bar span{font-size:12px;color:var(--dim)}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr) 360px;gap:26px;
 max-width:1560px;margin:0 auto;padding:22px 28px 60px;align-items:start}
@media(max-width:1240px){.wrap{grid-template-columns:320px minmax(0,1fr)}.colC{grid-column:1/-1}}
@media(max-width:880px){.wrap{grid-template-columns:1fr;padding:18px}.colB{order:-1}.stage{position:static!important}}
.col{min-width:0}
h2{font:400 11px/1 system-ui;letter-spacing:.14em;color:var(--dim);margin:0 0 11px;
 padding:0 0 8px;border-bottom:1px solid var(--rule)}
.grp{margin:0 0 22px}
.f{margin:0 0 10px}
label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 4px}
select,input[type=text],input[type=number]{width:100%;height:36px;font-size:14px;color:var(--txt);
 background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:0 11px}
select{padding-right:30px;appearance:none;cursor:pointer;
 background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
 background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat}
select:hover,input:hover{background:var(--panel2)}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 0}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);cursor:pointer;margin:0}
.checks input{width:16px;height:16px;accent-color:var(--fg)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:12.5px;height:29px;padding:0 10px;border-radius:99px;background:var(--panel);
 border:1px solid var(--rule);color:var(--dim);cursor:pointer}
.presets button:hover{background:var(--panel2);color:var(--txt)}
.presets button.on{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.stage{position:sticky;top:20px;border-radius:18px;overflow:hidden;transition:box-shadow .5s ease;
 background:radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.05),transparent 70%)}
.stage svg{display:block;width:100%;height:auto}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin:16px 0 0}
.card h3{font:400 27px/1.2 ui-serif,Georgia,serif;margin:0 0 2px}
.card .sub{font:italic 400 14px/1.5 ui-serif,Georgia,serif;color:var(--dim);margin:0 0 12px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 12px;font-size:13.5px}
.card dt{color:var(--dim)}.card dd{margin:0}
.card p{font:400 14.5px/1.65 ui-serif,Georgia,serif;margin:0 0 8px}
.card .hi{color:var(--hi)}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;margin:0 0 12px}
.box h4{font:400 11px/1 system-ui;letter-spacing:.13em;color:var(--dim);margin:0 0 9px}
.msg{font-size:13px;line-height:1.6;color:var(--dim);margin:0}
.msg b{font-weight:400;color:var(--hi)}
.msg.w{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 0;border-top:1px solid var(--rule);vertical-align:top}
td:first-child{color:var(--dim);width:46%}td:last-child{text-align:right}
details{margin:0 0 10px}
summary{font-size:12.5px;color:var(--dim);cursor:pointer;padding:10px 0;
 border-top:1px solid var(--rule);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--fg)}details[open] summary::after{content:" \2212"}
pre{font:11.5px/1.7 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;color:var(--dim);
 background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;margin:0 0 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts button{height:38px;font-size:13.5px;color:var(--txt);background:var(--panel);
 border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.acts button:hover{background:var(--panel2)}
</style>
</head>
<body>
<div class="bar"><h1>SPELL CIRCLE FORGE</h1><span>Describe the spell the way your book does. The circle is worked out for you.</span></div>

<div class="wrap">
  <div class="col">
    <div class="grp"><h2>START FROM A SPELL</h2><div class="presets" id="presets"></div></div>
    <div class="grp"><h2>THE SPELL</h2>
      <div class="f"><label for="name">Name</label><input type="text" id="name" value="Fireball"></div>
      <div class="two">
        <div class="f"><label for="level">Level</label><select id="level"></select></div>
        <div class="f"><label for="school">School</label><select id="school"></select></div>
      </div>
      <div class="two">
        <div class="f"><label for="time">Casting time</label><select id="time"></select></div>
        <div class="f"><label for="range">Range</label><select id="range"></select></div>
      </div>
      <div class="two">
        <div class="f"><label for="area">Area of effect</label><select id="area"></select></div>
        <div class="f"><label for="dtype">Damage type</label><select id="dtype"></select></div>
      </div>
      <div class="two">
        <div class="f"><label for="effect">What it does</label><select id="effect"></select></div>
        <div class="f"><label for="save">Resolves with</label><select id="save"></select></div>
      </div>
      <div class="two">
        <div class="f"><label for="dur">Duration</label><select id="dur"></select></div>
        <div class="f"><label for="flav">Flavour</label><select id="flav"></select></div>
      </div>
      <div class="f"><label>Components</label>
        <div class="checks">
          <label><input type="checkbox" id="cV" checked>Verbal</label>
          <label><input type="checkbox" id="cS" checked>Somatic</label>
          <label><input type="checkbox" id="cM">Material</label>
          <label><input type="checkbox" id="cR">Ritual</label>
        </div>
      </div>
      <div class="f" id="matwrap" style="display:none"><label for="mat">Material component</label>
        <input type="text" id="mat" value="a tiny ball of bat guano and sulfur"></div>
    </div>
  </div>

  <div class="col colB">
    <div class="stage" id="stage"><div id="ring"></div></div>
    <div class="card">
      <h3 id="cName">Fireball</h3>
      <p class="sub" id="cSub">3rd-level evocation</p>
      <dl>
        <dt>Casting Time</dt><dd id="cTime"></dd>
        <dt>Range</dt><dd id="cRange"></dd>
        <dt>Components</dt><dd id="cComp"></dd>
        <dt>Duration</dt><dd id="cDur"></dd>
      </dl>
      <p id="cText"></p>
      <p class="msg" id="cScale"></p>
    </div>
  </div>

  <div class="col colC">
    <div class="box"><h4>DRAWING THE CIRCLE</h4><p class="msg" id="mat1"></p></div>
    <div class="box"><h4>WHAT THE RINGS ARE</h4><table id="rings"></table></div>
    <details><summary>How this became a circle</summary>
      <table id="xlate"></table>
      <p class="msg" style="margin-top:10px" id="xnote"></p>
    </details>
    <details><summary>Written in Circlecant</summary><pre id="code"></pre></details>
    <div class="acts"><button id="png">Save image</button><button id="svg">Save vector</button></div>
  </div>
</div>

<script>
"use strict";
/* ================================================ D&D-side vocabulary */
const LEVELS=["cantrip","1st level","2nd level","3rd level","4th level","5th level","6th level","7th level","8th level","9th level"];
const SCHOOLS=["abjuration","conjuration","divination","enchantment","evocation","illusion","necromancy","transmutation"];
const TIMES={action:"1 action",bonus:"1 bonus action",reaction:"1 reaction",min1:"1 minute",min10:"10 minutes",hr1:"1 hour",hr8:"8 hours"};
const RANGES={self:"Self",touch:"Touch",ft30:"30 feet",ft60:"60 feet",ft120:"120 feet",
 ft300:"300 feet",mile:"1 mile",sight:"Sight",unlimited:"Unlimited"};
const AREAS={none:"None (one target)",cone15:"15-foot cone",cone60:"60-foot cone",line30:"30-foot line",
 line100:"100-foot line",sphere10:"10-foot-radius sphere",sphere20:"20-foot-radius sphere",
 cube10:"10-foot cube",cyl:"Cylinder",wall:"Wall",aura:"Aura around you",radius:"Radius around you"};
const DTYPES=["none","acid","bludgeoning","cold","fire","force","lightning","necrotic",
 "piercing","poison","psychic","radiant","slashing","thunder"];
const EFFECTS={damage:"Deals damage",healing:"Heals",buff:"Strengthens an ally",debuff:"Weakens a foe",
 control:"Controls the battlefield",utility:"Utility",summon:"Summons or creates",
 teleport:"Moves or teleports",divination:"Reveals information",protection:"Protects or wards",
 dispel:"Ends or counters magic"};
const SAVES={none:"Nothing; it just works",attack:"Spell attack roll",dex:"Dexterity save",
 con:"Constitution save",wis:"Wisdom save",str:"Strength save",int:"Intelligence save",
 cha:"Charisma save",contest:"Contested check"};
const DURS={inst:"Instantaneous",rnd1:"1 round",min1:"1 minute",min10:"10 minutes",hr1:"1 hour",
 hr8:"8 hours",hr24:"24 hours",dispel:"Until dispelled",perm:"Permanent"};

/* ================================================ Nexus-side machinery */
const ASPECT=["null","fire","frost","storm","stone","tide","gale","light","shadow","force","decay","growth","mind","time","space","void"];
const HUE={null:["#8fa3b8","#d7e2ee"],fire:["#ff5a2e","#ffc9a8"],frost:["#5fd8ff","#d3f4ff"],
 storm:["#8a7bff","#dcd6ff"],stone:["#c69a5a","#f0dcb8"],tide:["#2fd6a8","#c2f6e6"],
 gale:["#9fe8e0","#e2fbf8"],light:["#ffd45e","#fff1c4"],shadow:["#7f6bd8","#d5cbf6"],
 force:["#4fc3ff","#bfe9ff"],decay:["#8fd44f","#dcf3bd"],growth:["#4fe08a","#cfffe2"],
 mind:["#ff6fc4","#ffd0ec"],time:["#c9b6ff","#ece4ff"],space:["#b14fff","#e9d0ff"],void:["#e8eaf0","#ffffff"]};
const VCODE={draw:0,shape:1,alter:2,sense:3,bind:4,trigger:5,sever:6};
const SHAPES=["single","line","cone","beam","burst","wall","ring","dome","cloud","aura"];
const DELIVS=["emanates","projectile","ray","instantiate","touch","already"];
const ADDRS=["relative","perceptual","indirect","tagged","absolute"];
const PERSS=["instant","sustained","bound","dormant","permanent"];
const MAGS=["faint","minor","standard","strong","major","severe","redline"];
const MP={faint:.5,minor:1,standard:3,strong:5,major:10,severe:18,redline:30};
const SPREAD={single:1,line:1.3,cone:1.3,beam:1.25,burst:1.4,wall:1.6,ring:1.6,dome:1.8,cloud:1.4,aura:1.5};
const MEDIA=[["chalk",1,2,"1 hour"],["charcoal",2,3,"1 hour"],["blood",6,20,"2 hours"],
 ["iron filings",9,40,"3 hours"],["silver ink",20,34,"6 hours"],["gold leaf",30,180,"12 hours"],
 ["mithril inlay",65,900,"3 days"]];

/* ------------------------------------------------ translation tables */
const DMG2ASP={acid:"tide",bludgeoning:"force",cold:"frost",fire:"fire",force:"force",
 lightning:"storm",necrotic:"decay",piercing:"force",poison:"decay",psychic:"mind",
 radiant:"light",slashing:"force",thunder:"gale"};
const SCH2ASP={abjuration:"force",conjuration:"space",divination:"void",enchantment:"mind",
 evocation:"force",illusion:"shadow",necromancy:"decay",transmutation:"stone"};
const EFF2ASP={healing:"growth",dispel:"void",divination:"void",teleport:"space",protection:"force"};
const FLAV={auto:"Work it out for me",fire:"Fire",frost:"Cold or ice",storm:"Lightning or thunder",
 stone:"Earth, stone or metal",tide:"Water or acid",gale:"Air or sound",light:"Light or radiant",
 shadow:"Shadow or darkness",force:"Raw force",decay:"Necrotic, poison or rot",growth:"Life or healing",
 mind:"Mind or emotion",time:"Time or speed",space:"Space or distance",void:"Antimagic or unmaking"};
const SCH2VERB={abjuration:"bind",conjuration:"shape",divination:"sense",enchantment:"alter",
 evocation:"shape",illusion:"shape",necromancy:"shape",transmutation:"alter"};
const AREA2SHAPE={none:"single",cone15:"cone",cone60:"cone",line30:"line",line100:"line",
 sphere10:"burst",sphere20:"burst",cube10:"burst",cyl:"burst",wall:"wall",aura:"aura",radius:"burst"};
const LVL2MAG=["minor","minor","standard","strong","strong","major","major","severe","severe","redline"];
const DICE_SINGLE=["1d10","2d8","3d8","5d8","6d8","8d8","10d8","12d8","14d8","16d8"];
const DICE_AREA=["1d6","2d6","4d6","8d6","10d6","12d6","14d6","16d6","18d6","20d6"];
const DICE_HEAL=["1d4","2d8","3d8","4d8","5d8","6d8","7d8","8d8","9d8","10d8"];

/* ---------------------------------------------------------- presets */
const P={
 "Fire Bolt":{level:0,school:"evocation",time:"action",range:"ft120",area:"none",dtype:"fire",effect:"damage",save:"attack",dur:"inst",cV:1,cS:1},
 "Eldritch Blast":{level:0,school:"evocation",time:"action",range:"ft120",area:"none",dtype:"force",effect:"damage",save:"attack",dur:"inst",cV:1,cS:1},
 "Magic Missile":{level:1,school:"evocation",time:"action",range:"ft120",area:"none",dtype:"force",effect:"damage",save:"none",dur:"inst",cV:1,cS:1},
 "Shield":{flav:"force",level:1,school:"abjuration",time:"reaction",range:"self",area:"aura",dtype:"none",effect:"protection",save:"none",dur:"rnd1",cV:1,cS:1},
 "Cure Wounds":{level:1,school:"evocation",time:"action",range:"touch",area:"none",dtype:"none",effect:"healing",save:"none",dur:"inst",cV:1,cS:1},
 "Mage Armor":{flav:"force",level:1,school:"abjuration",time:"action",range:"touch",area:"aura",dtype:"none",effect:"protection",save:"none",dur:"hr8",cV:1,cS:1,cM:1,mat:"a piece of cured leather"},
 "Detect Magic":{level:1,school:"divination",time:"action",range:"self",area:"radius",dtype:"none",effect:"divination",save:"none",dur:"min10",cV:1,cS:1,cR:1},
 "Misty Step":{level:2,school:"conjuration",time:"bonus",range:"ft30",area:"none",dtype:"none",effect:"teleport",save:"none",dur:"inst",cV:1},
 "Darkness":{flav:"shadow",level:2,school:"evocation",time:"action",range:"ft60",area:"sphere10",dtype:"none",effect:"control",save:"none",dur:"min10",cV:1,cM:1,mat:"bat fur and a drop of pitch"},
 "Fireball":{level:3,school:"evocation",time:"action",range:"ft300",area:"sphere20",dtype:"fire",effect:"damage",save:"dex",dur:"inst",cV:1,cS:1,cM:1,mat:"a tiny ball of bat guano and sulfur"},
 "Lightning Bolt":{level:3,school:"evocation",time:"action",range:"self",area:"line100",dtype:"lightning",effect:"damage",save:"dex",dur:"inst",cV:1,cS:1,cM:1,mat:"a bit of fur and a glass rod"},
 "Counterspell":{level:3,school:"abjuration",time:"reaction",range:"ft60",area:"none",dtype:"none",effect:"dispel",save:"contest",dur:"inst",cS:1},
 "Dispel Magic":{level:3,school:"abjuration",time:"action",range:"ft120",area:"none",dtype:"none",effect:"dispel",save:"contest",dur:"inst",cV:1,cS:1},
 "Fly":{flav:"gale",level:3,school:"transmutation",time:"action",range:"touch",area:"none",dtype:"none",effect:"buff",save:"none",dur:"min10",cV:1,cS:1,cM:1,mat:"a wing feather"},
 "Haste":{flav:"time",level:3,school:"transmutation",time:"action",range:"ft30",area:"none",dtype:"none",effect:"buff",save:"none",dur:"min1",cV:1,cS:1,cM:1,mat:"a shaving of licorice root"},
 "Magic Mouth":{flav:"mind",level:2,school:"illusion",time:"min1",range:"ft30",area:"none",dtype:"none",effect:"utility",save:"none",dur:"dispel",cV:1,cS:1,cM:1,cR:1,mat:"jade dust worth 10 gp"},
 "Polymorph":{flav:"growth",level:4,school:"transmutation",time:"action",range:"ft60",area:"none",dtype:"none",effect:"debuff",save:"wis",dur:"hr1",cV:1,cS:1,cM:1,mat:"a caterpillar cocoon"},
 "Cone of Cold":{level:5,school:"evocation",time:"action",range:"self",area:"cone60",dtype:"cold",effect:"damage",save:"con",dur:"inst",cV:1,cS:1,cM:1,mat:"a small crystal"},
 "Scrying":{level:5,school:"divination",time:"hr1",range:"unlimited",area:"none",dtype:"none",effect:"divination",save:"wis",dur:"min10",cV:1,cS:1,cM:1,cR:1,mat:"a focus worth 1,000 gp"},
 "Wall of Force":{level:5,school:"evocation",time:"action",range:"ft120",area:"wall",dtype:"none",effect:"control",save:"none",dur:"min10",cV:1,cS:1,cM:1,mat:"a pinch of powder from a clear gemstone"},
 "Teleport":{level:7,school:"conjuration",time:"action",range:"ft30",area:"none",dtype:"none",effect:"teleport",save:"none",dur:"inst",cV:1},
 "Sending":{flav:"mind",level:3,school:"evocation",time:"action",range:"unlimited",area:"none",dtype:"none",effect:"utility",save:"none",dur:"rnd1",cV:1,cS:1,cM:1,cR:1,mat:"a copper wire"}};

let S={name:"Fireball"};
Object.assign(S,P["Fireball"]);
const $=i=>document.getElementById(i);

/* ============================================ D&D -> Nexus translation */
function derive(){
  const x={}, notes=[];
  x.aspect = S.flav && S.flav!=="auto" ? S.flav
    : S.dtype!=="none" ? DMG2ASP[S.dtype]
    : EFF2ASP[S.effect] || SCH2ASP[S.school];
  notes.push(S.flav&&S.flav!=="auto" ? `You picked <b>${x.aspect}</b> as the flavour.`
    : S.dtype!=="none" ? `${S.dtype} damage is the <b>${x.aspect}</b> aspect.`
    : EFF2ASP[S.effect] ? `${EFFECTS[S.effect].toLowerCase()} is <b>${x.aspect}</b> work whatever the school.`
    : `${S.school} with no damage type defaults to the <b>${x.aspect}</b> aspect.`);

  x.verb = S.effect==="dispel" ? "sever"
    : S.effect==="divination" ? "sense"
    : S.effect==="protection" ? "bind"
    : S.effect==="teleport" ? "alter"
    : S.effect==="buff"||S.effect==="debuff" ? "alter"
    : S.effect==="utility"&&["dispel","perm","hr24"].includes(S.dur) ? "trigger"
    : SCH2VERB[S.school];
  notes.push(`${EFFECTS[S.effect].toLowerCase()} in the ${S.school} school reads as <b>${x.verb}</b>.`);

  x.shape = AREA2SHAPE[S.area]||"single";
  if(S.effect==="teleport") x.shape="single";

  x.deliv = S.range==="self" ? (x.shape==="single"?"already":"emanates")
    : S.range==="touch" ? "touch"
    : S.range==="unlimited"||S.range==="mile" ? "instantiate"
    : (x.verb==="sever") ? "already"
    : (x.shape==="single" && ["damage","healing"].includes(S.effect)) ? "projectile"
    : "instantiate";
  notes.push(`Range ${RANGES[S.range]} with ${x.shape==="single"?"a single target":"an area"} means it <b>${
    {emanates:"emanates from you",projectile:"travels as a projectile",instantiate:"appears where addressed",
     touch:"is delivered by touch",already:"is already on you",ray:"runs as a ray"}[x.deliv]}</b>.`);

  x.addr = x.verb==="sever" ? "perceptual"
    : S.range==="unlimited"||S.range==="mile" ? "indirect"
    : S.range==="self"||S.range==="touch" ? "relative"
    : S.range==="sight" ? "perceptual"
    : x.deliv==="projectile" ? "perceptual" : "relative";

  x.mag = LVL2MAG[S.level];
  notes.push(`A ${LEVELS[S.level]} spell sits at <b>${x.mag}</b> strength.`);

  x.pers = S.dur==="inst" ? "instant"
    : S.dur==="perm"||S.dur==="dispel" ? (S.cR?"bound":"permanent")
    : S.conc ? "sustained"
    : ["hr8","hr24"].includes(S.dur) ? "bound" : "sustained";

  x.trig = S.time==="reaction" ? "reactive" : (x.pers==="bound"||x.pers==="dormant") ? "cond" : "now";
  if(S.time==="reaction") notes.push(`Cast as a reaction, so it fires <b>in response to a working</b>.`);

  x.inscribed = !!S.cR;
  if(S.cR) notes.push(`Ritual casting is <b>scribing the circle</b> instead of holding it in your head. That is why it takes longer and costs materials.`);
  x.fuel = x.inscribed ? "crystal" : "self";
  x.payload = S.effect==="utility" && (S.range==="unlimited" || ["dispel","perm"].includes(S.dur));
  if(x.payload) notes.push(`A spell that carries a message needs a ring to <b>hold</b> it.`);
  x.reagent = !!S.cM;
  x.spoken = !!S.cV;
  return {x,notes};
}

function cost(x){
  const dist={relative:1.25,perceptual:1.15,indirect:1,tagged:1.05,absolute:1}[x.addr];
  const del={emanates:.9,projectile:1,ray:1.2,instantiate:1.4,touch:.85,already:1}[x.deliv];
  const ch=Math.round(MP[x.mag]*dist*del*SPREAD[x.shape]*10)/10;
  const rounds={instant:1,sustained:10,bound:0,dormant:0,permanent:0}[x.pers];
  let pool=x.pers==="instant"?ch:(rounds?ch*rounds:2);
  if(x.addr==="indirect") pool+=ch*.4;
  return {ch,pool:Math.round(pool*10)/10};
}

/* ------------------------------------------------------ step emission */
function emit(x){
  const st=[],push=(v,a,why,you)=>st.push({v,a,why,you:!!you});
  push("draw","null",x.inscribed?"Pulls mana from the crystal seated in the circle."
    :"Pulls the mana out of you. Every spell opens this way.");
  if(x.trig!=="now") push("trigger",x.aspect,x.trig==="reactive"
    ?"Watches for the working it answers." : "Holds the circle dormant until its condition is met.");
  push(x.verb,x.aspect,"The effect itself. This is the ring that does what the spell says.",true);
  if(x.deliv==="projectile") push("bind","force","Binds force to it so it travels. This is what makes it a bolt rather than a flare.");
  if(["wall","ring","dome","aura"].includes(x.shape))
    push("bind",x.aspect,`Holds the ${x.shape} in its form. Standing shapes do not hold themselves.`);
  else if(x.pers!=="instant") push("bind",x.aspect,"Holds the working open for its duration.");
  if(x.payload) push("bind",x.aspect,"Stores the message in the circle. Anything that carries content needs somewhere to keep it.");
  if(x.inscribed) push("bind","force","Fixes the program to the surface. This is the ritual part.");
  return st.slice(0,7);
}

/* --------------------------------------------------------- the circle */
function word(x,i,S2){
  let w=(VCODE[x.v]||0)&7; w=w*8+(i&7);
  w=w*16+(ASPECT.indexOf(x.a)&15);
  w=w*8+(DELIVS.indexOf(S2.deliv)&7);
  w=w*16+(SHAPES.indexOf(S2.shape)&15);
  w=w*8+(ADDRS.indexOf(S2.addr)&7);
  w=w*8+(MAGS.indexOf(S2.mag)&7);
  w=w*16+(PERSS.indexOf(S2.pers)&15);
  w=w*2+(S2.pers==="instant"?0:1);
  let ck=0,t=w; for(let k=0;k<7;k++){ck^=t&15;t=Math.floor(t/16);}
  return w*16+ck;
}
const bits=w=>{const b=[];let t=w;for(let i=31;i>=0;i--){b[i]=t&1;t=Math.floor(t/2);}return b;};
const hx=w=>w.toString(16).toUpperCase().padStart(8,"0");
const PT=(r,d)=>{const t=(d-90)*Math.PI/180;return[450+r*Math.cos(t),450+r*Math.sin(t)];};
function loops(live,g){const p=live.length,o=[],s2=new Set();if(p<2)return o;
 for(let s=0;s<p;s++){if(s2.has(s))continue;const L=[];let k=s;
  while(!s2.has(k)){s2.add(k);L.push(live[k]);k=(k+g)%p;}if(L.length>1)o.push(L);}return o;}
function rune(n,h){const b=[n&1,(n>>1)&1,(n>>2)&1,(n>>3)&1],t=-h/2,bo=h/2,w=.42*h,d=[];
 d.push(`M0 ${t}L0 ${bo}`,`M${-.22*w} ${bo}L${.22*w} ${bo}`);
 if(b[0])d.push(`M0 ${t}L${-w} ${t+.3*h}`); if(b[1])d.push(`M0 ${t}L${w} ${t+.3*h}`);
 if(b[2])d.push(`M${-.8*w} 0L${.8*w} 0`);
 if(b[3])d.push(`M${-.7*w} ${bo-.3*h}L0 ${bo}L${.7*w} ${bo-.3*h}`);
 if(b[0]&&b[3]){const r=.16*h;d.push(`M${-r} ${-.22*h}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`);}
 return d.join("");}
function svg(prog,x){
 const pal=HUE[x.aspect]||HUE.force,fg=pal[0],hi=pal[1],n=prog.length,o=[];
 const dump=prog.map((p,i)=>hx(word(p,i,x))).join("");
 o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">`);
 o.push(`<defs><filter id="g" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="6" result="a"/><feGaussianBlur stdDeviation="16" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`);
 o.push(`<rect width="900" height="900" fill="#05070a"/>`);
 o.push(`<g filter="url(#g)" fill="none" stroke="${fg}" stroke-linecap="round" stroke-linejoin="round">`);
 [[430,3],[420,1.4],[368,1.4],[360,3]].forEach(([r,w])=>o.push(`<circle cx="450" cy="450" r="${r}" stroke-width="${w}"/>`));
 const two=dump.length>32;
 const bands=two?[[401,dump.slice(0,Math.ceil(dump.length/2))],[381,dump.slice(Math.ceil(dump.length/2))]]:[[394,dump]];
 bands.forEach(([rr,tx])=>{const st=360/tx.length;
  for(let i=0;i<tx.length;i++){const dg=i*st+st/2,[px,py]=PT(rr,dg);
   o.push(`<g transform="translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${dg.toFixed(1)})"><path d="${rune(parseInt(tx[i],16),two?18:25)}" stroke="${hi}" stroke-width="${two?1.8:2.3}"/></g>`);}});
 const fr=336,vs=[];for(let i=0;i<n;i++)vs.push(PT(fr,i*360/n));
 const pts=a=>a.map(p=>p.map(q=>q.toFixed(1)).join(",")).join(" ");
 if(n>=3){o.push(`<polygon points="${pts(vs)}" stroke-width="2.6"/>`);
  if([3,4,6].includes(n)){const tw=[];for(let i=0;i<n;i++)tw.push(PT(fr,i*360/n+180/n));
   o.push(`<polygon points="${pts(tw)}" stroke-width="2.6"/>`);}
  if(n>=5&&n%2===1){const k=(n-1)/2;for(let i=0;i<n;i++)
   o.push(`<line x1="${vs[i][0].toFixed(1)}" y1="${vs[i][1].toFixed(1)}" x2="${vs[(i+k)%n][0].toFixed(1)}" y2="${vs[(i+k)%n][1].toFixed(1)}" stroke-width="2"/>`);}}
 else if(n===2){const[a,b]=[PT(fr,0),PT(fr,180)];o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-width="2.6"/>`);}
 prog.forEach((p,i)=>{const[cx,cy]=PT(fr,i*360/n),dg=i*360/n;
  o.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="19" stroke-width="2.2" fill="#05070a"/>`);
  o.push(`<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${dg.toFixed(1)})"><path d="${rune(ASPECT.indexOf(p.a),21)}" stroke="${hi}" stroke-width="2"/></g>`);});
 const r0=292,dr=Math.min(54,(r0-74)/n);
 prog.forEach((p,idx)=>{const r=r0-idx*dr,b=bits(word(p,idx,x)),live=[],pp=[];
  o.push(`<circle cx="450" cy="450" r="${r.toFixed(1)}" stroke-width="1.2"/>`);
  for(let i=0;i<32;i++){pp.push(PT(r,i*11.25));if(b[i])live.push(i);}
  const g=live.length<3?1:1+(ASPECT.indexOf(p.a)%Math.max(1,live.length>>1));
  loops(live,g).forEach(L=>o.push(`<path d="M${L.map(k=>pp[k].map(q=>q.toFixed(1)).join(" ")).join("L")}Z" stroke-width="2.1"/>`));
  for(let i=0;i<32;i++){const[x2,y2]=pp[i];
   o.push(b[i]?`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5" fill="${hi}"/>`
              :`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2.8" stroke-width="1.3" fill="#05070a"/>`);}});
 const core=Math.max(28,r0-(n-1)*dr-42);
 o.push(`<circle cx="450" cy="450" r="${core.toFixed(1)}" stroke-width="2.4"/>`);
 o.push(`<circle cx="450" cy="450" r="${(core-9).toFixed(1)}" stroke-width="1.2"/>`);
 if(x.inscribed) o.push(`<circle cx="450" cy="450" r="${(core*.42).toFixed(1)}" fill="${fg}" stroke="none"/>`);
 o.push(`</g></svg>`); return o.join("");
}

/* ------------------------------------------------------- description */
function describe(x){
  const L=S.level, area=S.area!=="none";
  const dice = S.effect==="healing"?DICE_HEAL[L] : area?DICE_AREA[L]:DICE_SINGLE[L];
  const tgt = area ? `Each creature in ${AREAS[S.area].toLowerCase()}` : "A target you can reach";
  if(S.effect==="damage"){
    return S.save==="attack"
      ? `Make a ranged spell attack. On a hit, the target takes <span class="hi">${dice} ${S.dtype}</span> damage.`
      : S.save==="none"
      ? `${tgt} takes <span class="hi">${dice} ${S.dtype}</span> damage, with no roll to avoid it.`
      : `${tgt} makes a ${SAVES[S.save].replace(" save","")} saving throw, taking <span class="hi">${dice} ${S.dtype}</span> damage on a failure and half as much on a success.`;
  }
  if(S.effect==="healing") return `A creature you touch regains <span class="hi">${dice}</span> hit points.`;
  if(S.effect==="teleport") return `You vanish and reappear at an unoccupied space you can see within ${RANGES[S.range]}.`;
  if(S.effect==="dispel") return `You attempt to end a spell. ${S.save==="contest"?"Make an ability check against the caster's.":"It ends automatically."}`;
  if(S.effect==="divination") return `You sense the presence of magic within ${AREAS[S.area]==="Radius around you"?"30 feet":RANGES[S.range]} for the duration.`;
  if(S.effect==="protection") return `The target gains protection for the duration.`;
  if(S.effect==="control") return `You shape the area for the duration, controlling movement through it.`;
  if(S.effect==="summon") return `You create or summon something in an unoccupied space you can see.`;
  return `The spell takes effect as described in its entry.`;
}

/* ------------------------------------------------------------ render */
function ctrl(id,map,val){
  const e=Object.entries(map);
  $(id).innerHTML=e.map(([k,v])=>`<option value="${k}"${String(k)===String(val)?" selected":""}>${v}</option>`).join("");
}
function render(){
  ctrl("level",Object.fromEntries(LEVELS.map((l,i)=>[i,l])),S.level);
  ctrl("school",Object.fromEntries(SCHOOLS.map(s=>[s,s])),S.school);
  ctrl("time",TIMES,S.time); ctrl("range",RANGES,S.range);
  ctrl("area",AREAS,S.area); ctrl("dtype",Object.fromEntries(DTYPES.map(d=>[d,d])),S.dtype);
  ctrl("effect",EFFECTS,S.effect); ctrl("save",SAVES,S.save); ctrl("dur",DURS,S.dur);
  ctrl("flav",FLAV,S.flav||"auto");
  $("name").value=S.name;
  ["cV","cS","cM","cR"].forEach(k=>$(k).checked=!!S[k]);
  $("matwrap").style.display=S.cM?"":"none";
  if(S.mat) $("mat").value=S.mat;

  const {x,notes}=derive(), c=cost(x), prog=emit(x);
  const pal=HUE[x.aspect]||HUE.force;
  document.documentElement.style.setProperty("--fg",pal[0]);
  document.documentElement.style.setProperty("--hi",pal[1]);
  $("stage").style.boxShadow=`inset 0 0 90px ${pal[0]}22`;
  $("ring").innerHTML=svg(prog,x);

  $("cName").textContent=S.name;
  $("cSub").textContent=S.level===0?`${S.school} cantrip`:`${LEVELS[S.level]} ${S.school}`;
  $("cTime").textContent=TIMES[S.time]+(S.cR?" (ritual)":"");
  $("cRange").textContent=RANGES[S.range]+(S.area!=="none"?` (${AREAS[S.area].toLowerCase()})`:"");
  const comp=[S.cV&&"V",S.cS&&"S",S.cM&&"M"].filter(Boolean).join(", ");
  $("cComp").textContent=comp+(S.cM&&$("mat").value?` (${$("mat").value})`:"");
  $("cDur").textContent=DURS[S.dur];
  $("cText").innerHTML=describe(x);
  $("cScale").textContent=S.level>0&&S.effect==="damage"
    ? "Cast at a higher level and the circle grows a ring; the damage rises with it." : "";

  const med=MEDIA.find(m=>m[1]>=c.ch);
  let m1;
  if(!x.inscribed){
    m1=`This one is cast, not drawn. The circle above is what it would look like written down — useful as a handout, a spellbook page, or something the party finds carved into a floor.`;
  } else if(med){
    m1=`As a ritual this gets scribed. At <b>${c.ch} mana per round</b> the thinnest medium that carries it is <b>${med[0]}</b>, about <b>${med[2]} gp</b> and <b>${med[3]}</b> of drawing.`
      +(S.cM?` The material component sits in one of the seats on the outer ring.`:"");
  } else {
    m1=`Nothing you can draw with carries ${c.ch} mana per round. This one can only be cast.`;
  }
  $("mat1").innerHTML=m1;

  $("rings").innerHTML=prog.map((p,i)=>
    `<tr><td>Ring ${i+1}</td><td style="text-align:left;color:var(--txt)">${p.why}</td></tr>`).join("");

  $("xlate").innerHTML=[["Aspect",x.aspect],["Verb",x.verb],["Delivery",x.deliv],
   ["Addressing",x.addr],["Shape",x.shape],["Strength",x.mag],["Persistence",x.pers],
   ["Trigger",x.trig],["Fuel",x.fuel],["Peak draw",c.ch+" MP/round"],["Total",c.pool+" MP"]]
   .map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  $("xnote").innerHTML=notes.join(" ");

  $("code").textContent=`spell ${S.name.replace(/[^A-Za-z0-9]/g,"")}:\n`
    +(x.inscribed?`\tinscribe:\n\t\twith = ${med?med[0]:"—"}\n\n`:"")
    +`\ton cast:\n`+prog.map(p=>
      `\t\t${p.v} ${p.a} as ${x.shape} ${x.addr} with strength ${x.mag}`).join("\n");

  document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on",b.textContent===S.name));
}

/* -------------------------------------------------------------- wiring */
$("presets").innerHTML=Object.keys(P).map(n=>`<button>${n}</button>`).join("");
document.querySelectorAll("#presets button").forEach(b=>b.onclick=()=>{
  S={name:b.textContent}; Object.assign(S,P[b.textContent]); render();});
["level","school","time","range","area","dtype","effect","save","dur","flav"].forEach(id=>
  $(id).addEventListener("change",e=>{S[id]=id==="level"?+e.target.value:e.target.value;render();}));
["cV","cS","cM","cR"].forEach(id=>$(id).addEventListener("change",e=>{S[id]=e.target.checked?1:0;render();}));
$("name").addEventListener("input",e=>{S.name=e.target.value;
  $("cName").textContent=S.name;
  document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on",b.textContent===S.name));});
$("mat").addEventListener("input",()=>{S.mat=$("mat").value;render();});

function save(d,t,n){const u=URL.createObjectURL(new Blob([d],{type:t})),a=document.createElement("a");
 a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
const slug=()=>(S.name||"circle").toLowerCase().replace(/[^a-z0-9]+/g,"-");
$("svg").onclick=()=>save($("ring").innerHTML,"image/svg+xml",slug()+".svg");
$("png").onclick=()=>{const img=new Image(),u=URL.createObjectURL(new Blob([$("ring").innerHTML],{type:"image/svg+xml"}));
 img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=1400;
  const g=c.getContext("2d");g.fillStyle="#05070a";g.fillRect(0,0,1400,1400);
  g.drawImage(img,0,0,1400,1400);URL.revokeObjectURL(u);
  c.toBlob(b=>save(b,"image/png",slug()+".png"),"image/png");};
 img.onerror=()=>alert("This browser will not rasterise the circle. Use Save vector.");
 img.src=u;};
render();
</script>
</body>
</html>
